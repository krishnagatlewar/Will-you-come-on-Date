<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>When Are We Meeting? ⏰</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#fff;background:linear-gradient(135deg,#ec4899,#8b5cf6,#14b8a6,#f59e0b);background-size:400% 400%;animation:bg 13s ease infinite}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(650px,95vw);padding:38px 24px;border:1px solid #ffffff40;background:#ffffff1c;backdrop-filter:blur(18px);border-radius:30px;text-align:center;box-shadow:0 25px 80px #0003}.card h1{font-size:clamp(30px,7vw,48px);margin:10px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px;text-align:left;margin-top:28px}.field label{display:block;margin:0 0 7px;font-weight:700}.input{width:100%;padding:15px;border:1px solid #ffffff55;border-radius:14px;background:#ffffff22;color:#fff;font:600 16px Poppins;outline:none}.input::-webkit-calendar-picker-indicator{filter:invert(1)}.preview{margin:22px 0;padding:18px;border-radius:18px;background:#ffffff18;min-height:60px;font-weight:700}.go{width:100%;padding:16px;border:0;border-radius:16px;background:#fff;color:#db2777;font:800 17px Poppins;cursor:pointer}.go:disabled{opacity:.45;cursor:not-allowed}.msg{min-height:27px;margin-top:12px;font-weight:600}@media(max-width:560px){.fields{grid-template-columns:1fr}}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
</style></head><body><div class="wrap"><main class="card"><div style="font-size:48px">📅⏰💕</div><h1>When are we meeting??</h1><p>Pick the date and time. I promise I'm taking this appointment very seriously 😌</p><div class="fields"><div class="field"><label for="date">Date</label><input class="input" id="date" type="date"></div><div class="field"><label for="time">Time</label><input class="input" id="time" type="time"></div></div><div class="preview" id="preview">Choose a date and time 💕</div><div class="msg" id="msg"></div><button class="go" id="go" disabled>Let's Gooooo!!!!!! 🚀</button></main></div>
<script>
const CONFIG={LOG_URL:"https://script.google.com/macros/s/AKfycbyCQQUxXvC9L_f-jf99xZobTenvx4irsgVBQ7NQhyGTke0jKrBYl4dK28iRu4ZEqnGm/exec"};const KEY="dateInvite";let state=JSON.parse(localStorage.getItem(KEY)||"{}");if(!state.sessionId)state.sessionId="DATE-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();localStorage.setItem(KEY,JSON.stringify(state));const date=document.getElementById("date"),time=document.getElementById("time"),preview=document.getElementById("preview"),msg=document.getElementById("msg"),go=document.getElementById("go");const today=new Date();date.min=today.toISOString().slice(0,10);date.value=state.selectedDate||"";time.value=state.selectedTime||"";
function logEvent(event,option="",extra={}){const d=new URLSearchParams({sessionId:state.sessionId,page:"Page 3",event,option,selectedDate:state.selectedDate||"",selectedTime:state.selectedTime||"",timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",localTime:new Date().toString(),browser:navigator.userAgent,device:/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"Mobile":"Desktop",screenSize:innerWidth+"x"+innerHeight,...extra});try{navigator.sendBeacon(CONFIG.LOG_URL,d)}catch(e){fetch(CONFIG.LOG_URL,{method:"POST",body:d,keepalive:true}).catch(()=>{})}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function niceDate(v){return new Date(v+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}function niceTime(v){const [h,m]=v.split(":").map(Number),d=new Date();d.setHours(h,m,0);return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}function update(){go.disabled=!(date.value&&time.value);if(date.value&&time.value){preview.textContent=`We’re meeting on ${niceDate(date.value)} at ${niceTime(time.value)} 💕`;msg.textContent="Okay wow... this is officially happening 😭🥰"}else if(date.value){preview.textContent=`${niceDate(date.value)} — now choose a time ⏰`;msg.textContent="Pick a time too!"}else if(time.value){preview.textContent=`${niceTime(time.value)} — now choose a date 📅`;msg.textContent="Pick a date too!"}else{preview.textContent="Choose a date and time 💕";msg.textContent=""}}
date.onchange=()=>{state.selectedDate=date.value;save();logEvent("Date Selected",date.value,{selectedDate:date.value});update()};time.onchange=()=>{state.selectedTime=time.value;save();logEvent("Time Selected",time.value,{selectedTime:time.value});update()};go.onclick=()=>{if(!date.value||!time.value){msg.textContent=!date.value?"Please choose a date first 📅":"Please choose a time first ⏰";return}state.selectedDate=date.value;state.selectedTime=time.value;save();logEvent("Confirm",date.value+" "+time.value,{selectedDate:date.value,selectedTime:time.value,selected:"Yes"});location.href="page4.html"};update();
</script></body></html>
