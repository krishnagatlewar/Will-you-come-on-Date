<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Our Date Plans 💕</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899,#06b6d4,#f97316);background-size:400% 400%;animation:bg 14s ease infinite}.wrap{min-height:100vh;padding:28px 16px 50px;display:flex;justify-content:center}.card{width:min(760px,96vw);padding:32px 20px;border:1px solid #ffffff40;background:#ffffff18;backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 25px 80px #0003}.head{text-align:center}.head h1{font-size:clamp(28px,6vw,44px);margin:8px 0}.head p{opacity:.9}.activity{background:#ffffff18;border:1px solid #ffffff30;border-radius:20px;margin:14px 0;overflow:hidden}.headrow{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer}.icon{font-size:30px}.name{font-weight:700;font-size:18px;flex:1}.arrow{transition:.25s}.body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 18px}.activity.open .body{max-height:220px;padding:0 18px 20px}.activity.open .arrow{transform:rotate(180deg)}.detail{opacity:.9;line-height:1.6}.check{display:flex;align-items:center;gap:10px;margin-top:15px;font-weight:600}.check input{width:20px;height:20px;accent-color:#fff}.confirm{width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;font:800 17px Poppins;cursor:pointer;background:#fff;color:#7c3aed}.confirm:disabled{opacity:.45;cursor:not-allowed}.selected{margin-top:12px;text-align:center;font-size:14px;opacity:.85}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
</style></head><body><div class="wrap"><main class="card"><div class="head"><div style="font-size:46px">🗓️💕</div><h1>Choose the options you want to do on date?</h1><p>Tap a card to reveal the plan. Pick as many as you want!</p></div><div id="activities"></div><button class="confirm" id="confirm" disabled>Confirm My Choices →</button><div class="selected" id="selectedText">Choose at least one option ✨</div></main></div>
<script>
const CONFIG={LOG_URL:"https://script.google.com/macros/s/AKfycbyCQQUxXvC9L_f-jf99xZobTenvx4irsgVBQ7NQhyGTke0jKrBYl4dK28iRu4ZEqnGm/exec"};const KEY="dateInvite";let state=JSON.parse(localStorage.getItem(KEY)||"{}");if(!state.sessionId){state.sessionId="DATE-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}state.selectedActivities=state.selectedActivities||[];localStorage.setItem(KEY,JSON.stringify(state));
const activities=[{name:"Coffee and good food",icon:"☕",detail:"A relaxed coffee, something delicious to eat, and plenty of time to talk."},{name:"Bowling",icon:"🎳",detail:"A little friendly competition, questionable bowling skills, and lots of laughs."},{name:"Go Karting",icon:"🏎️",detail:"Fast laps, dramatic overtakes, and absolutely no excuses for losing."},{name:"Long drive",icon:"🚗",detail:"Good music, open roads, random conversations, and a little adventure."},{name:"Shopping",icon:"🛍️",detail:"Walk around, browse everything, find something fun, and make a day of it."}];
function logEvent(event,option="",extra={}){const d=new URLSearchParams({sessionId:state.sessionId,page:"Page 2",event,option,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",localTime:new Date().toString(),browser:navigator.userAgent,device:/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"Mobile":"Desktop",screenSize:innerWidth+"x"+innerHeight,...extra});try{navigator.sendBeacon(CONFIG.LOG_URL,d)}catch(e){fetch(CONFIG.LOG_URL,{method:"POST",body:d,keepalive:true}).catch(()=>{})}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}const root=document.getElementById("activities");activities.forEach((a,i)=>{const el=document.createElement("section");el.className="activity";el.innerHTML=`<div class="headrow"><span class="icon">${a.icon}</span><span class="name">${a.name}</span><span class="arrow">⌄</span></div><div class="body"><div class="detail">${a.detail}</div><label class="check"><input type="checkbox" data-i="${i}" ${state.selectedActivities.includes(a.name)?"checked":""}> Select this option</label></div>`;root.appendChild(el);el.querySelector(".headrow").onclick=()=>{el.classList.toggle("open");logEvent("Expand",a.name,{selected:el.classList.contains("open")?"Open":"Close"})};el.querySelector("input").onchange=e=>{if(e.target.checked){if(!state.selectedActivities.includes(a.name))state.selectedActivities.push(a.name)}else state.selectedActivities=state.selectedActivities.filter(x=>x!==a.name);save();logEvent("Select",a.name,{selected:e.target.checked?"Yes":"No"});update()}});function update(){const n=state.selectedActivities.length;document.getElementById("confirm").disabled=n===0;document.getElementById("selectedText").textContent=n?state.selectedActivities.join(" • "):"Choose at least one option ✨"}update();document.getElementById("confirm").onclick=()=>{if(!state.selectedActivities.length)return;save();logEvent("Confirm",state.selectedActivities.join(" | "),{selected:"Yes"});location.href="page3.html"};
</script></body></html>
