<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IT'S A DATE!!! 🎉</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#fff;overflow:hidden;background:linear-gradient(135deg,#f43f5e,#ec4899,#8b5cf6,#06b6d4);background-size:400% 400%;animation:bg 10s ease infinite}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(720px,95vw);padding:40px 24px;text-align:center;border:1px solid #ffffff50;background:#ffffff1c;backdrop-filter:blur(18px);border-radius:32px;box-shadow:0 25px 90px #0003;position:relative;z-index:2}.party{font-size:60px}.card h1{font-size:clamp(42px,10vw,76px);line-height:1;margin:12px 0}.date{font-size:clamp(20px,5vw,30px);font-weight:800;margin:20px 0}.activities{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:15px 0 25px}.pill{padding:9px 13px;border-radius:999px;background:#ffffff22;border:1px solid #ffffff35;font-weight:600}.msg{font-size:22px;font-weight:700}.small{opacity:.9}.conf{position:fixed;top:-50px;animation:fall linear forwards;pointer-events:none;z-index:1}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:0}}
</style></head><body><div class="wrap"><main class="card"><div class="party">🎉🥳💕</div><h1>IT'S A DATE!!!</h1><div class="date" id="dateTime"></div><div class="activities" id="activities"></div><div class="msg">Can’t wait to see you!! 🥰</div><p class="small">Now you better not cancel on me 😂💕</p></main></div>
<script>
const CONFIG={LOG_URL:"https://script.google.com/macros/s/AKfycbyCQQUxXvC9L_f-jf99xZobTenvx4irsgVBQ7NQhyGTke0jKrBYl4dK28iRu4ZEqnGm/exec"};const KEY="dateInvite";let state=JSON.parse(localStorage.getItem(KEY)||"{}");const dt=document.getElementById("dateTime");function niceDate(v){return v?new Date(v+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"Date not selected"}function niceTime(v){if(!v)return"Time not selected";const [h,m]=v.split(":").map(Number),d=new Date();d.setHours(h,m);return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}dt.textContent=`${niceDate(state.selectedDate)} at ${niceTime(state.selectedTime)}`;const icons={"Coffee and good food":"☕","Bowling":"🎳","Go Karting":"🏎️","Long drive":"🚗","Shopping":"🛍️"};document.getElementById("activities").innerHTML=(state.selectedActivities||[]).map(x=>`<span class="pill">${icons[x]||"✨"} ${x}</span>`).join("");function logEvent(event,option="",extra={}){const d=new URLSearchParams({sessionId:state.sessionId||"",page:"Page 4",event,option,selectedDate:state.selectedDate||"",selectedTime:state.selectedTime||"",noClickCount:String(state.noClicks||0),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",localTime:new Date().toString(),browser:navigator.userAgent,device:/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"Mobile":"Desktop",screenSize:innerWidth+"x"+innerHeight,...extra});try{navigator.sendBeacon(CONFIG.LOG_URL,d)}catch(e){fetch(CONFIG.LOG_URL,{method:"POST",body:d,keepalive:true}).catch(()=>{})}}logEvent("Final View",(state.selectedActivities||[]).join(" | "),{selected:"Yes"});const symbols=["🎉","💕","✨","💖","🥳","🎊","💗"];for(let i=0;i<45;i++){const e=document.createElement("div");e.className="conf";e.textContent=symbols[i%symbols.length];e.style.left=Math.random()*100+"vw";e.style.fontSize=16+Math.random()*24+"px";e.style.animationDuration=3+Math.random()*5+"s";e.style.animationDelay=Math.random()*3+"s";document.body.appendChild(e)}
</script></body></html>
