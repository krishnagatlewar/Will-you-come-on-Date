<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>So... It's a Date? 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#fff;overflow:hidden;background:linear-gradient(135deg,#ff6b9d,#8b5cf6,#22d3ee,#fb7185);background-size:400% 400%;animation:bg 12s ease infinite}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative}.card{width:min(680px,94vw);padding:42px 28px;border:1px solid #ffffff45;background:#ffffff20;backdrop-filter:blur(18px);border-radius:30px;box-shadow:0 25px 80px #0003;text-align:center;position:relative;z-index:2}.emoji{font-size:52px}.card h1{font-size:clamp(30px,7vw,54px);line-height:1.08;margin:12px 0}.sub{opacity:.9;margin:0 auto 28px}.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:15px 24px;font:700 16px Poppins;cursor:pointer;transition:.2s;box-shadow:0 10px 25px #0002}.btn:hover{transform:translateY(-3px) scale(1.02)}.yes{background:#fff;color:#ec4899}.yes2{background:#fde68a;color:#7c2d12}.no-zone{height:150px;margin:20px auto 0;max-width:560px;border-radius:22px;border:1px dashed #ffffff55;position:relative;overflow:hidden}.no{position:absolute;background:#ffffff28;color:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}.hint{min-height:28px;margin:12px 0 0;font-weight:600}.heart{position:fixed;bottom:-30px;opacity:.35;animation:float 8s linear infinite;pointer-events:none}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}@keyframes float{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}@media(max-width:500px){.card{padding:32px 18px}.no-zone{height:125px}.btn{padding:13px 18px;font-size:14px}}
</style></head><body><div class="wrap"><div class="card"><div class="emoji">💌</div><h1>Do you want to come on a date with me?</h1><p class="sub">I have a very important question... and only one correct answer 😌💕</p><div class="buttons"><button class="btn yes" data-choice="Yes">Yes 💖</button><button class="btn yes2" data-choice="Yes Ofcourse!!">Yes Ofcourse!! 🥰</button></div><div class="hint" id="hint"></div><div class="no-zone" id="noZone"><button class="btn no" id="noBtn">No 😏</button></div></div></div>
<script>
const CONFIG={LOG_URL:"https://script.google.com/macros/s/AKfycbyCQQUxXvC9L_f-jf99xZobTenvx4irsgVBQ7NQhyGTke0jKrBYl4dK28iRu4ZEqnGm/exec"};const KEY="dateInvite";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");if(!state.sessionId)state.sessionId="DATE-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();state.noClicks=state.noClicks||0;localStorage.setItem(KEY,JSON.stringify(state));
function browser(){return navigator.userAgent}function device(){return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"Mobile":"Desktop"}
function logEvent(event,option="",extra={}){const d=new URLSearchParams({sessionId:state.sessionId,page:"Page 1",event,option,noClickCount:String(state.noClicks),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",localTime:new Date().toString(),browser:browser(),device:device(),screenSize:innerWidth+"x"+innerHeight,...extra});try{navigator.sendBeacon(CONFIG.LOG_URL,d)}catch(e){fetch(CONFIG.LOG_URL,{method:"POST",body:d,keepalive:true}).catch(()=>{})}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
document.querySelectorAll("[data-choice]").forEach(b => {
  b.onclick = () => {
    state.page1Choice = b.dataset.choice;
    save();

    logEvent("Click", b.dataset.choice, {
      selected: "Yes"
    });

    location.href = "page2.html";
  };
});
const zone=document.getElementById("noZone"),no=document.getElementById("noBtn"),hint=document.getElementById("hint");let noTexts=["Are you sure? 😏","Nice try 😂","The No button is running away!","Maybe Yes Ofcourse!!? 🥹","I know you want to say yes 😈💕"];no.onclick=()=>{state.noClicks++;save();logEvent("Click","No",{selected:"No"});hint.textContent=noTexts[Math.min(state.noClicks-1,noTexts.length-1)];const pad=8,maxX=Math.max(pad,zone.clientWidth-no.offsetWidth-pad),maxY=Math.max(pad,zone.clientHeight-no.offsetHeight-pad);no.style.transform="none";no.style.left=(pad+Math.random()*Math.max(0,maxX-pad))+"px";no.style.top=(pad+Math.random()*Math.max(0,maxY-pad))+"px"};
for(let i=0;i<12;i++){const h=document.createElement("div");h.className="heart";h.textContent=["♥","♡","💗"][i%3];h.style.left=Math.random()*100+"%";h.style.animationDelay=Math.random()*7+"s";h.style.fontSize=18+Math.random()*25+"px";document.body.appendChild(h)}
</script></body></html>
